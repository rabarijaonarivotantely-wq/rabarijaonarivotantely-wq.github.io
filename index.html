<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Vonona</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  font-family:system-ui;
  background:radial-gradient(circle at top,#7c3aed,#4c1d95);
  min-height:100vh;
}
.glass{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
}
.card{
  background:white;
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
  transition:all .2s ease;
}
.card:hover{transform:translateY(-3px)}
.toast{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%);
  background:black;color:white;
  padding:10px 20px;border-radius:20px;
  opacity:0;transition:.3s;
}
.toast.show{opacity:1}
@media (prefers-color-scheme:dark){
  body{background:#111827}
  .card{background:#1f2937;color:white}
}
</style>
</head>

<body class="text-gray-800">

<div id="app" class="max-w-md mx-auto p-4">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
<h1 class="text-2xl font-bold text-white">🇲🇬 Vonona</h1>
<button onclick="logout()" class="text-white text-sm">Logout</button>
</div>

<!-- CREATE POST -->
<div class="card p-4 mb-6">
<textarea id="postText" placeholder="Exprime toi..."
class="w-full outline-none resize-none"></textarea>

<input type="file" id="fileInput" hidden accept="image/*">
<button onclick="document.getElementById('fileInput').click()"
class="text-sm text-purple-600 mt-2">Ajouter une image</button>

<div id="imgPreview" class="mt-3 hidden">
<img id="previewImg" class="rounded-xl max-h-60 w-full object-cover">
</div>

<button onclick="publish()" 
class="w-full mt-4 bg-purple-600 text-white py-2 rounded-xl">
Publier
</button>
</div>

<!-- FEED -->
<div id="feed"></div>

</div>

<div id="toast" class="toast"></div>

<script>

// ================= STATE =================

const store={
  currentUser:null,
  users:JSON.parse(localStorage.getItem('users'))||[],
  posts:JSON.parse(localStorage.getItem('posts'))||[],
  liked:JSON.parse(localStorage.getItem('liked'))||[]
};

function save(){
  localStorage.setItem('users',JSON.stringify(store.users));
  localStorage.setItem('posts',JSON.stringify(store.posts));
  localStorage.setItem('liked',JSON.stringify(store.liked));
}

// ================= UTILS =================

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function escapeHTML(str){
  return str.replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#039;'
  })[m]);
}

async function hashPassword(password){
  const encoder=new TextEncoder();
  const data=encoder.encode(password);
  const hash=await crypto.subtle.digest("SHA-256",data);
  return Array.from(new Uint8Array(hash))
    .map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ================= AUTH =================

async function autoLogin(){
  let user=localStorage.getItem("currentUser");
  if(user){
    store.currentUser=JSON.parse(user);
  }else{
    const name=prompt("Nom ?");
    const pass=prompt("Mot de passe ?");
    const hash=await hashPassword(pass);

    let found=store.users.find(u=>u.name===name && u.password===hash);

    if(!found){
      found={
        id:Date.now(),
        name,
        password:hash
      };
      store.users.push(found);
      save();
    }
    store.currentUser=found;
    localStorage.setItem("currentUser",JSON.stringify(found));
  }
}

function logout(){
  localStorage.removeItem("currentUser");
  location.reload();
}

// ================= IMAGE COMPRESSION =================

function compressImage(file,maxWidth=800){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const scale=maxWidth/img.width;
        canvas.width=maxWidth;
        canvas.height=img.height*scale;
        canvas.getContext('2d')
          .drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.7));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ================= POSTS =================

let selectedImage=null;

document.getElementById('fileInput').addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file) return;
  selectedImage=await compressImage(file);
  document.getElementById('previewImg').src=selectedImage;
  document.getElementById('imgPreview').classList.remove('hidden');
});

function publish(){
  const text=document.getElementById('postText').value.trim();
  if(!text && !selectedImage){
    toast("Post vide");
    return;
  }

  const post={
    id:Date.now(),
    user:store.currentUser.name,
    text,
    image:selectedImage,
    likes:0
  };

  store.posts.unshift(post);
  save();
  render();
  document.getElementById('postText').value='';
  document.getElementById('imgPreview').classList.add('hidden');
  selectedImage=null;
}

function render(){
  const feed=document.getElementById('feed');
  feed.innerHTML='';

  store.posts.forEach(p=>{
    const liked=store.liked.includes(p.id);

    const div=document.createElement('div');
    div.className="card p-4 mb-4";
    div.innerHTML=`
      <h4 class="font-bold mb-2">${escapeHTML(p.user)}</h4>
      <p class="mb-3">${escapeHTML(p.text)}</p>
      ${p.image?`<img loading="lazy" 
        src="${p.image}" 
        class="rounded-xl mb-3 w-full object-cover max-h-80">`:''}
      <button id="like-${p.id}"
      class="${liked?'text-red-500':'text-gray-500'}">
      ❤️ ${p.likes}
      </button>
    `;

    div.querySelector(`#like-${p.id}`)
      .addEventListener('click',()=>likePost(p.id));

    feed.appendChild(div);
  });
}

function likePost(id){
  if(store.liked.includes(id)){
    toast("Déjà aimé");
    return;
  }

  const post=store.posts.find(p=>p.id===id);
  if(!post) return;

  post.likes++;
  store.liked.push(id);
  save();

  const btn=document.getElementById(`like-${id}`);
  btn.textContent=`❤️ ${post.likes}`;
  btn.classList.add('text-red-500');
}

// ================= INIT =================

(async()=>{
  await autoLogin();
  render();
})();

</script>
</body>
</html>
